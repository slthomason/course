<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Simple Unordered List</h2>
    <ul>
       <li>HTML</li>
       <li>Java</li>
       <li>JavaScript</li>
       <li>SQL</li>
    </ul>

    <h2>type:disc Unordered List</h2>
    <ul style="list-style-type:disc;">
         <li>HTML</li>
         <li>Java</li>
         <li>JavaScript</li>
         <li>SQL</li>
    </ul>

    <h2>type:circle Unordered List</h2>
    <ul style="list-style-type:circle;">
        <li>HTML</li>
        <li>Java</li>
        <li>JavaScript</li>
        <li>SQL</li>
    </ul>

    <h2>type:none nordered List</h2>
    <ul style="list-style-type:none;">
         <li>HTML</li>
         <li>Java</li>
         <li>JavaScript</li>
         <li>SQL</li>
    </ul>
</body>

</html>
