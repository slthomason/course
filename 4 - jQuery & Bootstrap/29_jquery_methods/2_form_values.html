<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I am the page title</title>
   
    <!-- using CDN jquery file -->
    <script src="https://code.jquery.com/jquery-3.6.0.js"
        integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
</head>

<body>

    <form id="frm1">
        <label for="name">Enter your name: </label>
        <input type="text" name="name" id="name" required>
        <br>
        <label for="email">Enter your email: </label>
        <input type="email" name="email" id="email" required>
        <br>
        <label for="password">Enter your password: </label>
        <input type="password" name="password" />
        <br>
        <label for="description">Enter your description: </label>
        <textarea rows="5" cols="50" name="description" id="description">
            Enter description here...
         </textarea>
        <br>
        <input type="checkbox" name="HTML" value="on">HTML
        <br>
        <input type="checkbox" name="CSS" value="on" checked> CSS
        <br>
        <input type="radio" name="gender" id="male" value="Male"> Male
        <br>
        <input type="radio" name="gender" value="Female"> Female
        <br>
    </form>

    <script>
        $(document).ready(function () {
            //gettting value
            console.log($("#name").val());
            console.log($("#email").val());

            //setting value
            $("#email").val("sp@gmail.com");

            //setting value
            $("#description").val("this is text example");

            console.log($("#male").is("checked"));

            console.log($("#male").prop("checked", true)); // one of the way to get the attribute
            //get value of selected radio
            console.log($("input[type=radio]:checked").val());

        });
    </script>
</body>

</html>
