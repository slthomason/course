<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I am the page title</title>
</head>

<body>
    <p id="intro">Finding HTML Elements by Id</p>
    <p>getElementsByTagName will select this tag</p>
    <p class="intro">getElementsByClassName will select this tag</p>
    <p class="intro">Hello World!.</p>
    <p class="intro">This example demonstrates the <b>querySelectorAll</b> method.</p>

    <form id="frm1" >
        First name: <input type="text" name="fname" value="Donald"><br>
        Last name: <input type="text" name="lname" value="Duck"><br><br>
        <input type="submit" value="Submit">
    </form>
    <a href="#temp"></a>
    <img src="channels4_profile.jpg" alt="">
    <embed type="video/webm" src="Insta.mp4" width="250" height="200">
    <script>
        // BY ID
        console.log(document.getElementById("intro"));
        
        // BY Tag Name
        console.log(document.getElementsByTagName("p"))
        
        // BY Class Name
        console.log(document.getElementsByClassName("intro"))
        
        // Select multiple with css selectors
        console.log(document.querySelectorAll("p.intro"))

        // Select first with css selectors
        console.log(document.querySelector("p.intro"))
        

        // HTML object collections
        console.log(document.anchors);
        console.log(document.forms);
        console.log(document.body);
        console.log(document.documentElement);
        console.log(document.embeds);
        console.log(document.forms);
        console.log(document.head);
        console.log(document.images);
        console.log(document.links);
        console.log(document.scripts);
        console.log(document.title);
    </script>
</body>

</html>
