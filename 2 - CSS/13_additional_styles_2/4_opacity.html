<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img#example-1 {
            opacity: 0.5;
        }

        .example_2 img {
            opacity: 0.5;
        }

        .example_2 img:hover {
            opacity: 1.0;
        }

        .example_3 div.background {
            background: url(channels4_profile.jpg) repeat;
            border: 2px solid black;
        }

        .example_3 div.transbox {
            margin: 30px;
            background-color: #ffffff;
            border: 1px solid black;
            opacity: 0.6;
        }

        .example_3 div.transbox p {
            margin: 5%;
            font-weight: bold;
            color: #000000;
        }
    </style>
</head>

<body>
    <p>Image with 50% opacity:</p>
    <img id="example-1" src="channels4_profile.jpg" alt="Forest" width="170" height="100">

    <div class="example_2">
        <img src="channels4_profile.jpg" alt="profile" width="170" height="100">
        <img src="channels4_profile.jpg" alt="profile" width="170" height="100">
        <img src="channels4_profile.jpg" alt="profile" width="170" height="100">
    </div>

    <div class="example_3">
        <div class="background">
            <div class="transbox">
                <p>This is some text that is placed in the transparent box.</p>
            </div>
        </div>
    </div>
</body>

</html>
