<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form with Get Method</h1>
    <form method="get">
        <label for="name">Enter your name: </label>
        <input type="text" name="name" id="name" required>
        <input type="submit" value="Subscribe!">
    </form>
    <h1>Form with Post Method</h1>
    <form method="post">
        <label for="name">Enter your name: </label>
        <input type="text" name="name" id="name" required>
        <input type="submit" value="Subscribe!">
    </form>
    <h1>Form Target</h1>
    <form Target="_blank">
        <label for="name">Enter your name: </label>
        <input type="text" name="name" id="name" required>
        <input type="submit" value="Subscribe!">
    </form>
    <h1>Form Action</h1>
    <form method="get" action="3. Forms Attributes.html">
        <label for="name">Enter your name: </label>
        <input type="text" name="name" id="name" required>
        <input type="submit" value="Subscribe!">
    </form>
    <h1>Form Auto complete</h1>
    <form method="get" autocomplete="on" action="3. Forms Attributes.html">
        <label for="name">Enter your name: </label>
        <input type="text" name="name" id="name" required>
        <input type="submit" value="Subscribe!">
    </form>
    <h1>Form novalidate</h1>
    <form method="get" autocomplete="on" action="3. Forms Attributes.html" novalidate>
        <label for="name">Enter your name: </label>
        <input type="text" name="name" id="name" required>
        <input type="submit" value="Subscribe!">
    </form>
</body>
</html>
