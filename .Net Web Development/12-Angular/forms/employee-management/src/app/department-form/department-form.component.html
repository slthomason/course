<h1>Department Reactive Form</h1>
<form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="name">Department Name:</label>
    <input type="text" id="name" formControlName="name" required>
  </div>
  <div>
    <label for="head">Department Head:</label>
    <input type="text" id="head" formControlName="head" required>
  </div>
  <div>
    <label for="budget">Budget:</label>
    <input type="number" id="budget" formControlName="budget" required>
  </div>
  <button type="submit" [disabled]="!departmentForm.valid">Submit</button>
</form>

<!-- Display the submitted data if the form is valid -->
<div *ngIf="submittedData">
  <h2>Submitted Department Data:</h2>
  <p><strong>Department Name:</strong> {{ submittedData.name }}</p>
  <p><strong>Department Head:</strong> {{ submittedData.head }}</p>
  <p><strong>Budget:</strong> {{ submittedData.budget }}</p>
</div>
