<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // approach one
        function myDisplayer1(some) {
            console.log(some);
        }

        function myCalculator1(num1, num2) {
            // time consuming statments.
            let sum = num1 + num2;
            return sum;
        }

        let result = myCalculator1(5, 5);
        myDisplayer1(result);


        // approach two //  you could call a calculator function (myCalculator2), and let the calculator function call the display function (myDisplayer2)
        //2
        function myDisplayer2(some) {
            console.log("2" + some);
        }

        function myCalculator2(num1, num2) {
            // time consuming statments.
            let sum = num1 + num2;
            myDisplayer2(sum);
        }

        //3
        function myDisplayer3(some) {
            console.log("3" + some);
        }

        function myCalculator3(num1, num2, myCallback) {
            debugger;
            let sum = num1 + num2;
            myCallback(sum);
        }

        myCalculator3(5, 5, myDisplayer2);

        myCalculator2(5, 5);
    </script>
</head>
