<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>
        window.alert("We are almost completed JS");
        let txt;
        if (confirm("Did you get the JS concepts")) {
            txt = "You pressed OK!";
        } else {
            txt = "You pressed Cancel!";
        }
        window.alert(txt);

        let person = prompt("Please enter your name", "Spencer");
        let text;
        if (person == null || person == "") {
            text = "User cancelled the prompt.";
        } else {
            text = "Hello " + person + "! How are you today?";
        }
        window.alert(text);

        alert("Hello\nHow are you?");
    </script>
</body>

</html>
