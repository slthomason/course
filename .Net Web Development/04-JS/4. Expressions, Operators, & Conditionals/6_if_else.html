<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var age = 10;

        // simple if
        if (age < 18) {
            console.log("Under 18!");
            console.log("still under 18!");
            console.log("and still under 18!");
        }

        //if else
        age = 20;
        console.log("age = " + age);
        if (age < 18) {
            console.log("Under 18!");
        } else {
            console.log("Adult!");
        }

        // if else, else if
        age = 55;
        console.log("age = " + age);        
        if (age < 5) {
            console.log("Dependent");
        } else if (age < 18) {
            console.log("Under 18!");
        } else if (age < 50) {
            console.log("Adults");
        } else {
            console.log("Old people");
        }


        //Ternary
        console.log(age < 18 ? "Under 18!" : "Adult!");
        var stringAge = (age < 18) ? "Under 18!" : "Adult!";
        console.log(stringAge);
    </script>
</head>

</body>

</html>
