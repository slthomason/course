<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Radio Button</h2>
    <p>Please select your favorite Web language:</p>
    <input type="radio" id="html" name="fav_language" value="HTML">
    <label for="html">HTML</label><br>
    <input type="radio" id="css" name="fav_language" value="CSS">
    <label for="css">CSS</label><br>
    <input type="radio" id="javascript" name="fav_language" checked value="JavaScript">
    <label for="javascript">JavaScript</label>

    <br>
    
    <p>Please select your age:</p>
    <input type="radio" id="age1" name="age" value="30">
    <label for="age1">0 - 30</label><br>
    <input type="radio" id="age2" name="age" value="60">
    <label for="age2">31 - 60</label><br>
    <input type="radio" id="age3" name="age" value="100">
    <label for="age3">61 - 100</label><br><br>
    
    <h2>Checkbox</h2>
    <input type="checkbox" name="mycheckbox" id="mycheckboxhtml" value="on">HTML
    <br>
    <input type="checkbox" name="mycheckbox" id="mycheckboxcss" value="on"> CSS
    <br>
    <input type="submit" value="Submit">
</body>

</html>
