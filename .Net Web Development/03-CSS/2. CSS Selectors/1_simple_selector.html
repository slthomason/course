<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
            color: powderblue;
        }

        #para1 {
            text-align: center;
            color:chartreuse;
        }

        .center {
            text-align: center;
            color: red;
        }

        h5.center {
            text-align: center;

        }

        * {
            text-align: center;

        }

            text-align: center;
            color: blueviolet;
        }

        h2 {
            text-align: center;
            color:brown;
        }

        p {

            color: red;
        }

        .large {
            font-size: xx-large;
        }

</head>

<body>

    <h1> we are leanning Simple Selectors </h1>

    <h2 id="para1"> This is Header tag with Id para1 </h2>

    <h4 class="center"> This is Header tag with class para1</h4>

    <h5 class="center"> This is Header tag with class para1</h5>

    <h6 class="center"> This is Header tag with class para1</h5>
    <p class="center large">
        <input type="button">
        This paragraph refers to two classes.
    </p>

</html>
