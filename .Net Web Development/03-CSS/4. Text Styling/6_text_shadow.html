<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1#white_shadow {
        color: white;
        text-shadow: 2px 2px 4px #000000;
        }
        h1#blue_shadow {
        color: white;
        text-shadow: 1px 1px 2px black, 0 0 25px blue, 0 0 5px darkblue;
        }
    </style>
</head>
<body>
    <h1 style="text-shadow: 2px 2px;">Text-shadow effect!</h1>
    <h1 style="text-shadow: 2px 2px red;">Text-shadow effect!</h1>
    <h1 style="text-shadow: 2px 2px 5px red;">Text-shadow effect!</h1>
    <h1 id="white_shadow">Text-shadow effect!</h1>
    <h1 style=" text-shadow: 0 0 3px #FF0000;">Text-shadow with red neon glow!</h1>
    <h1 style="text-shadow: 0 0 3px #FF0000, 0 0 5px #0000FF;">Text-shadow with red and blue neon glow!</h1>
    <h1 id="blue_shadow">Text-shadow effect!</h1>
</body>
</html>
