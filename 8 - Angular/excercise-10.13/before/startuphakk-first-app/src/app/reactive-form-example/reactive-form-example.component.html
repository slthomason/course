<h1>Reactive forms</h1>
<div class="container">
    <form [formGroup]="myForm" (ngSubmit)="onSubmit(myForm)">

        <fieldset>
            <div class="form-group">
                <label>First Name</label>
                <input formControlName="firstName" type="text" class="form-control" name="firstName">
            <div *ngIf="myForm.get('firstName')?.invalid" class="error"> 
                Please Enter first name
            </div>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" formControlName="lastName" class="form-control" name="lastName">
                <div *ngIf="myForm.get('lastName')?.invalid" class="error"> 
                    Please Enter Last name
                </div>
            </div>
        </fieldset>
        <div class="form-group">
            <label>Email</label>
            <input type="email" formControlName="email"  class="form-control" name="email">
            <div *ngIf="myForm.get('email')?.invalid" class="error"> 
                Please Enter email
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" formControlName="password" class="form-control" name="password">
            <div *ngIf="myForm.get('password')?.invalid" class="error"> 
                Please Enter password
            </div>
        </div>
        <div class="form-group">
            <label>Language</label>
            <select class="form-control" name="language" formControlName="language">
                <option value="">Please select a language</option>
                <option *ngFor="let lang of langs" [value]="lang">{{lang}}
                </option>
            </select>

            <div *ngIf="myForm.get('language')?.invalid" class="error"> 
                Please select language
            </div>
        </div>

        <button type="submit" [disabled]="myForm.invalid" class="btn btn-primary">Submit
        </button>

    </form>
</div>
