<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <!-- using CDN jquery file -->
     <script src="https://code.jquery.com/jquery-3.6.0.js"
         integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
</head>

<body>
    <h1>Git User List</h1>
    <ul id="gitusrList">

    </ul>
    <script>
        $.get("https://api.github.com/users", async (response) => {
            debugger;
            html = "";
            console.log(response);
            response.forEach(x => {
                debugger;
                html += '<li>' + x.login + '</li>'
                //can you add the link to their profile:
                //property -- html_url
            })
            $("#gitusrList").html(html);

        })
    </script>
</body>

</html>
