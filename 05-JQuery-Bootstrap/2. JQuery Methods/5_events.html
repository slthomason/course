<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- using CDN jquery file -->
    <script src="https://code.jquery.com/jquery-3.6.0.js"
        integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
</head>

<body>
    <h2>JavaScript Event Listener</h2>

    <!-- on click event attached by attribute example  -->
    <button id="myBtn">Increment 1+</button>
    <p id="totalClicks">0</p>

    <!-- on change example -->
    <input type="text" id="fname">
    <span id="typedValue"></span>

    <!-- mouse over and mouse out example -->
    <div id="mouseExample">Mouse Over Me</div>

    <script>
        $(document).ready(function () {
            alert('body loaded');

            $("#myBtn").click(function () {
                $("#totalClicks").text(parseInt($("#totalClicks").text()) + 1);
            });

            $("#fname").change(function () {
                $("#typedValue").text($("#fname").val());
            });

            $("#mouseExample").mouseover(function () {
                $(this).html("Thank You");
            });

            $("#mouseExample").mouseout(function () {
                $(this).html("Mouse Over Me");
            });
        });
    </script>
</body>

</html>
