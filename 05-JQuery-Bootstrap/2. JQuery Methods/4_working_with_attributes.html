<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I am the page title</title>

    <!-- using CDN jquery file -->
    <script src="https://code.jquery.com/jquery-3.6.0.js"
        integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>

    <style>
        .important {
            font-weight: bold;
            font-size: xx-large;
        }

        .blue {
            color: blue;
        }
    </style>
</head>

<body>

    <h1 id="h1">Heading 1</h1>
    <h2 id="h2">Heading 2</h2>

    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>

    <div>This is some important text!</div><br>

    <div id="example1" style="background-color:#0000ff">This is some important text!</div><br>
    <script>
        $(document).ready(function () {

            $("h1, h2, p").addClass("blue");
            $("div").addClass("important");

            setTimeout(function () {
                $("h1, h2, p").removeClass("blue");
            }, 2000);

            setInterval(() => {
                $("div").toggleClass("important");
            })

            $("#example1").css("background-color");

            //single style sett
            $("p").css("background-color", "pink");

            // multiple css setting
            $("p").css({
                "background-color": "gray",
                "height": "100px"
            });


            console.log($("h1").attr("id"));
            console.log($("h1").prop("id"));

            $("h1").attr("id", "h11");
            $("h2").prop("id", "h21");
        });
    </script>
</body>

</html>
