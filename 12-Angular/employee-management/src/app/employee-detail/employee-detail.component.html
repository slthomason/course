<h1>Employee Details</h1>
<!-- Display employee details if available -->
<div *ngIf="employee" class="employee-details">
    <p><strong>Name:</strong> {{ employee.name }}</p> <!-- Display employee name -->
    <p><strong>Age:</strong> {{ employee.age }}</p> <!-- Display employee age -->
    <p><strong>Email:</strong> {{ employee.email }}</p> <!-- Display employee email -->
    
    <div><a routerLink="/employees">Go Back...</a></div> <!-- Link to navigate back to the employee list -->
</div>
<!-- Display loading message if employee data is not yet available -->
<div *ngIf="!employee" class="loading">
    <p>Loading...</p> <!-- Loading message while fetching data -->
</div>
