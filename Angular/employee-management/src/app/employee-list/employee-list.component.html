<h1>Employee List</h1> 
<!-- Link to add a new employee, redirects to the Add Employee page -->
<a routerLink="/add-employee" class="add-employee-link">Add Employee</a>

<!-- Table to display the employee list -->
<table class="employee-table">
    <thead>
        <tr>
            <th>Name</th> <!-- Column for employee name -->
            <th>Age</th>  <!-- Column for employee age -->
            <th>Email</th> <!-- Column for employee email -->
            <th>Action</th> <!-- Column for actions like 'View' -->
        </tr>
    </thead>
    <tbody>
        <!-- Loop through the employees array using *ngFor and display each employee's details -->
        <tr *ngFor="let employee of employees">
            <td>{{ employee.name }}</td> <!-- Display employee name -->
            <td>{{ employee.age }}</td>   <!-- Display employee age -->
            <td>{{ employee.email }}</td> <!-- Display employee email -->
            <td><a routerLink="/employee/{{employee.id}}">View</a></td> <!-- Link to view employee details using the employee's ID -->
        </tr>
    </tbody>
</table>
